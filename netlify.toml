[build]
  command = """
    set -e
    echo "=== Starting Build Process ==="
    echo "Node version: $(node --version)"
    echo "Hugo version: $(hugo version)"
    echo "Go version: $(go version || echo 'Go not available')"
    
    echo "=== Cleaning Hugo cache ==="
    rm -rf resources/_gen/
    rm -rf .hugo_build.lock
    
    echo "=== Installing dependencies ==="
    pnpm install --no-frozen-lockfile
    
    echo "=== Running Hugo build with verbose logging ==="
    hugo --gc --minify -b $URL --logLevel info
    
    echo "=== Build completed successfully ==="
  """
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.128.0"
  GO_VERSION = "1.22"
  NODE_VERSION = "22"
  PNPM_FLAGS = "--no-frozen-lockfile"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = """
    set -e
    rm -rf resources/_gen/
    rm -rf .hugo_build.lock
    pnpm install --no-frozen-lockfile
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL
  """

[context.branch-deploy]
  command = """
    set -e
    rm -rf resources/_gen/
    rm -rf .hugo_build.lock
    pnpm install --no-frozen-lockfile
    hugo --gc --minify -b $DEPLOY_PRIME_URL
  """
